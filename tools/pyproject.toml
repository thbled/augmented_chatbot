[project]
name = "conference-tools"
version = "0.1.0"
description = "Outils de préparation des données de la conférence et de la base de connaissances du LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
conference-tools = "conference_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conference_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF"]
# Typographie française volontaire (tirets demi-cadratin, guillemets, ×).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
